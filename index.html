<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anbud – Profilforum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #edf0f5;
    --surface: #ffffff;
    --ink: #16202e;
    --muted: #58657a;
    --line: #d3dae5;
    --signal: #c8102e;
    --signal-fg: #ffffff;
    --plate: #4f6280;
    --plate-fg: #ffffff;
    --plate-done: #e3e8f0;
    --plate-done-fg: #7a8698;
    --t1-bg: #16263f;
    --t1-fg: #ffffff;
    --t2-bg: #dce3ee;
    --t2-fg: #16263f;
    --t3-fg: #58657a;
    --ok: #1f7a4c;
    --focus: #1f5fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1522;
      --surface: #161f30;
      --ink: #e7ecf4;
      --muted: #94a1b6;
      --line: #27324a;
      --signal: #e8374f;
      --signal-fg: #ffffff;
      --plate: #3e5478;
      --plate-done: #222c41;
      --plate-done-fg: #7c899e;
      --t1-bg: #e7ecf4;
      --t1-fg: #0e1522;
      --t2-bg: #26324a;
      --t2-fg: #e7ecf4;
      --t3-fg: #94a1b6;
      --ok: #4cc28a;
      --focus: #7aa7ff;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  a { color: inherit; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }

  .top {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  h1 {
    margin: 0;
    font: 700 36px/1.05 "Barlow Semi Condensed", "Barlow", sans-serif;
    letter-spacing: -0.01em;
  }
  .muted { color: var(--muted); }
  #updated { margin: 6px 0 0; font-size: 15px; }
  .ext { font-weight: 500; font-size: 15px; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 6px; overflow: hidden; margin-bottom: 16px;
  }
  .stat {
    appearance: none; border: 0; background: transparent; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
    padding: 12px 16px; display: flex; align-items: baseline; gap: 10px;
  }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat[aria-pressed="true"] { background: var(--t1-bg); color: var(--t1-fg); }
  .stat .n { font: 700 26px/1 "Barlow Semi Condensed", "Barlow", sans-serif; }
  .stat .l { font-size: 15px; }

  .filters {
    display: grid; gap: 10px;
    grid-template-columns: minmax(180px, 2fr) repeat(3, minmax(130px, 1fr));
    margin-bottom: 10px;
  }
  .filters input[type="search"], .filters select, .status-select {
    width: 100%; font: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 9px 10px;
  }
  .checks { display: flex; gap: 20px; flex-wrap: wrap; margin: 4px 0 18px; font-size: 15px; }
  .checks label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }

  .count { margin: 0 0 8px; font-size: 15px; }

  .row {
    display: grid; grid-template-columns: 84px 1fr 168px; gap: 16px;
    align-items: start; background: var(--surface);
    border: 1px solid var(--line); border-left: 5px solid var(--line);
    border-radius: 6px; padding: 14px 16px; margin-bottom: 10px;
  }
  .row.tier-1 { border-left-color: var(--t1-bg); }
  .row.st-byr { border-left-color: var(--ok); }
  .row.st-pass { opacity: 0.6; }

  .plate {
    background: var(--plate); color: var(--plate-fg);
    border-radius: 5px; text-align: center; padding: 8px 4px 7px;
    min-height: 62px; display: flex; flex-direction: column; justify-content: center;
  }
  .plate.urgent { background: var(--signal); color: var(--signal-fg); }
  .plate.done { background: var(--plate-done); color: var(--plate-done-fg); }
  .plate .big { font: 700 28px/1 "Barlow Semi Condensed", "Barlow", sans-serif; }
  .plate .big.word { font-size: 19px; }
  .plate .small { font-size: 13px; margin-top: 3px; }

  .main h2 { margin: 0 0 2px; font-size: 18px; line-height: 1.25; font-weight: 600; }
  .main h2 a { text-decoration: none; }
  .main h2 a:hover { text-decoration: underline; }
  .buyer { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; }
  .meta .k { color: var(--muted); margin-right: 5px; }
  details { margin-top: 8px; font-size: 14px; }
  summary { cursor: pointer; color: var(--muted); }
  details p { margin: 6px 0 0; max-width: 72ch; }

  .side { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .tier {
    align-self: flex-start; font-size: 13px; font-weight: 600;
    padding: 2px 9px; border-radius: 4px;
  }
  .tier.t1 { background: var(--t1-bg); color: var(--t1-fg); }
  .tier.t2 { background: var(--t2-bg); color: var(--t2-fg); }
  .tier.t3 { border: 1px solid var(--line); color: var(--t3-fg); }

  .empty {
    background: var(--surface); border: 1px dashed var(--line);
    border-radius: 6px; padding: 28px 22px;
  }
  .empty strong { display: block; margin-bottom: 4px; font-size: 18px; }

  @media (max-width: 820px) {
    .filters { grid-template-columns: 1fr 1fr; }
    .filters input[type="search"], .filters #f-sort { grid-column: 1 / -1; }
    .row { grid-template-columns: 72px 1fr; }
    .side { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
    .side .status-select { max-width: 190px; }
  }
  @media (max-width: 520px) {
    h1 { font-size: 30px; }
    .stats { grid-template-columns: 1fr; }
    .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Anbud</h1>
      <p id="updated" class="muted">Laster data …</p>
    </div>
    <a class="ext" href="https://www.doffin.no/" target="_blank" rel="noopener">Åpne Doffin</a>
  </header>

  <section class="stats" aria-label="Hurtigfilter">
    <button class="stat" type="button" data-quick="new" aria-pressed="false">
      <span class="n" id="n-new">–</span><span class="l">nye siste to døgn</span>
    </button>
    <button class="stat" type="button" data-quick="tier1" aria-pressed="false">
      <span class="n" id="n-tier1">–</span><span class="l">åpne i Tier 1</span>
    </button>
    <button class="stat" type="button" data-quick="soon" aria-pressed="false">
      <span class="n" id="n-soon">–</span><span class="l">med frist innen 14 dager</span>
    </button>
  </section>

  <section class="filters" aria-label="Filtre">
    <input id="f-q" type="search" placeholder="Søk i tittel, oppdragsgiver og beskrivelse" aria-label="Søk">
    <select id="f-tier" aria-label="Tier">
      <option value="">Alle tier</option>
      <option value="1">Tier 1</option>
      <option value="2">Tier 2</option>
      <option value="3">Tier 3</option>
    </select>
    <select id="f-mine" aria-label="Min status">
      <option value="">Alle statuser</option>
      <option value="none">Ikke vurdert</option>
      <option value="vurderer">Vurderer</option>
      <option value="byr">Vi byr</option>
      <option value="pass">Pass</option>
    </select>
    <select id="f-sort" aria-label="Sortering">
      <option value="deadline">Nærmeste frist først</option>
      <option value="published">Nyeste først</option>
      <option value="value">Høyest verdi først</option>
    </select>
  </section>
  <div class="checks">
    <label><input type="checkbox" id="f-open" checked> Bare åpne anbud</label>
    <label><input type="checkbox" id="f-hidepass" checked> Skjul dem jeg har satt til pass</label>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <main id="list"></main>
</div>

<script>
(function () {
  'use strict';

  var STATUS_KEY = 'anbud-status-v1';
  var statuses = loadStatuses();
  var notices = [];
  var F = { q: '', tier: '', mine: '', sort: 'deadline', onlyOpen: true, hidePass: true, quick: null };

  function loadStatuses() {
    try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveStatuses() {
    try { localStorage.setItem(STATUS_KEY, JSON.stringify(statuses)); } catch (e) { /* ignorer */ }
  }

  function el(tag, props) {
    var n = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      kids.forEach(function (kid) {
        if (kid == null || kid === false) return;
        n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      });
    }
    return n;
  }

  function daysLeft(n) {
    if (!n.deadline) return null;
    var d = new Date(n.deadline);
    if (isNaN(d)) return null;
    var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var t = new Date();
    var b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((a - b) / 86400000);
  }
  function isOpen(n) {
    var dl = daysLeft(n);
    return n.still_listed !== false && (dl === null || dl >= 0);
  }
  function isNew(n) {
    if (!n.first_seen) return false;
    var seen = new Date(n.first_seen + 'T00:00:00');
    var t = new Date();
    var today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return (today - seen) / 86400000 <= 1;
  }

  var dateFmt = new Intl.DateTimeFormat('nb-NO', { day: 'numeric', month: 'short', year: 'numeric' });
  var dateTimeFmt = new Intl.DateTimeFormat('nb-NO', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  function fmtDate(s, withTime) {
    var d = new Date(s);
    if (isNaN(d)) return null;
    var hasTime = withTime && String(s).length > 10;
    return (hasTime ? dateTimeFmt : dateFmt).format(d);
  }
  function fmtValue(n) {
    if (n.value == null) return null;
    var v = n.value, cur = n.currency || 'NOK';
    if (cur === 'NOK') {
      if (v >= 1e6) return (v / 1e6).toLocaleString('nb-NO', { maximumFractionDigits: 1 }) + ' MNOK';
      if (v >= 1e3) return Math.round(v / 1e3).toLocaleString('nb-NO') + ' tNOK';
    }
    return v.toLocaleString('nb-NO') + ' ' + cur;
  }

  function visible() {
    var q = F.q.trim().toLowerCase();
    return notices.filter(function (n) {
      var st = statuses[n.id] || '';
      var dl = daysLeft(n);
      if (F.onlyOpen && !isOpen(n)) return false;
      if (F.hidePass && st === 'pass' && F.mine !== 'pass') return false;
      if (F.tier && String(n.tier) !== F.tier) return false;
      if (F.mine === 'none' && st !== '') return false;
      if (F.mine && F.mine !== 'none' && st !== F.mine) return false;
      if (F.quick === 'new' && !isNew(n)) return false;
      if (F.quick === 'tier1' && n.tier !== 1) return false;
      if (F.quick === 'soon' && !(dl !== null && dl >= 0 && dl <= 14)) return false;
      if (q) {
        var hay = [n.title, n.buyer, n.description, (n.matched_keywords || []).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sortList(list) {
    var by = F.sort;
    return list.slice().sort(function (a, b) {
      if (by === 'published') return String(b.published).localeCompare(String(a.published));
      if (by === 'value') return (b.value || 0) - (a.value || 0);
      var da = daysLeft(a), db = daysLeft(b);
      if (da === null && db === null) return String(b.published).localeCompare(String(a.published));
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });
  }

  function platePart(n) {
    var dl = daysLeft(n);
    var cls = 'plate', big, small, word = false;
    if (dl === null) { big = '–'; small = 'ingen frist'; }
    else if (dl < 0) { cls += ' done'; big = 'Utløpt'; small = ''; word = true; }
    else if (dl === 0) { cls += ' urgent'; big = 'I dag'; small = 'frist'; word = true; }
    else { if (dl <= 7) cls += ' urgent'; big = String(dl); small = dl === 1 ? 'dag igjen' : 'dager igjen'; }
    return el('div', { 'class': cls },
      el('div', { 'class': 'big' + (word ? ' word' : ''), text: big }),
      small ? el('div', { 'class': 'small', text: small }) : null);
  }

  function metaItem(k, v) {
    return v ? el('span', {}, el('span', { 'class': 'k', text: k }), v) : null;
  }

  function row(n) {
    var st = statuses[n.id] || '';
    var url = 'https://www.doffin.no/notices/' + encodeURIComponent(n.id);
    var kw = (n.matched_keywords || []).slice(0, 6).join(', ');
    var cpv = (n.matched_cpv || []).slice(0, 4).join(', ');

    var select = el('select', {
      'class': 'status-select', 'aria-label': 'Min status for ' + (n.title || n.id),
      onchange: function (e) {
        var v = e.target.value;
        if (v) statuses[n.id] = v; else delete statuses[n.id];
        saveStatuses();
        render();
      }
    },
      el('option', { value: '', text: 'Ikke vurdert' }),
      el('option', { value: 'vurderer', text: 'Vurderer' }),
      el('option', { value: 'byr', text: 'Vi byr' }),
      el('option', { value: 'pass', text: 'Pass' }));
    select.value = st;

    return el('article', { 'class': 'row tier-' + n.tier + (st ? ' st-' + st : '') },
      platePart(n),
      el('div', { 'class': 'main' },
        el('h2', {}, el('a', { href: url, target: '_blank', rel: 'noopener', text: n.title || n.id })),
        el('p', { 'class': 'buyer', text: n.buyer || 'Oppdragsgiver ikke oppgitt' }),
        el('div', { 'class': 'meta' },
          metaItem('Frist', fmtDate(n.deadline, true)),
          metaItem('Publisert', fmtDate(n.published, false)),
          metaItem('Verdi', fmtValue(n)),
          metaItem('Treff på', kw),
          metaItem('CPV', cpv)),
        n.description ? el('details', {}, el('summary', { text: 'Beskrivelse' }), el('p', { text: n.description })) : null),
      el('div', { 'class': 'side' },
        el('span', { 'class': 'tier t' + n.tier, text: 'Tier ' + n.tier }),
        select));
  }

  function emptyState(title, text) {
    return el('div', { 'class': 'empty' }, el('strong', { text: title }), el('span', { 'class': 'muted', text: text }));
  }

  function updateStats() {
    var open = notices.filter(isOpen);
    document.getElementById('n-new').textContent = open.filter(isNew).length;
    document.getElementById('n-tier1').textContent = open.filter(function (n) { return n.tier === 1; }).length;
    document.getElementById('n-soon').textContent = open.filter(function (n) {
      var d = daysLeft(n); return d !== null && d >= 0 && d <= 14;
    }).length;
    document.querySelectorAll('.stat').forEach(function (b) {
      b.setAttribute('aria-pressed', String(F.quick === b.dataset.quick));
    });
  }

  function render() {
    var list = document.getElementById('list');
    list.replaceChildren();
    updateStats();
    var shown = sortList(visible());
    document.getElementById('count').textContent =
      notices.length ? 'Viser ' + shown.length + ' av ' + notices.length + ' anbud' : '';
    if (!notices.length) {
      list.append(emptyState('Ingen anbud i datafilen ennå',
        'Kjør arbeidsflyten «Oppdater anbud» under Actions i GitHub, så fylles listen.'));
      return;
    }
    if (!shown.length) {
      list.append(emptyState('Ingen anbud matcher filtrene',
        'Fjern et filter, eller utvid kodene og nøkkelordene i config.json.'));
      return;
    }
    shown.forEach(function (n) { list.append(row(n)); });
  }

  function bind() {
    document.getElementById('f-q').addEventListener('input', function (e) { F.q = e.target.value; render(); });
    document.getElementById('f-tier').addEventListener('change', function (e) { F.tier = e.target.value; render(); });
    document.getElementById('f-mine').addEventListener('change', function (e) { F.mine = e.target.value; render(); });
    document.getElementById('f-sort').addEventListener('change', function (e) { F.sort = e.target.value; render(); });
    document.getElementById('f-open').addEventListener('change', function (e) { F.onlyOpen = e.target.checked; render(); });
    document.getElementById('f-hidepass').addEventListener('change', function (e) { F.hidePass = e.target.checked; render(); });
    document.querySelectorAll('.stat').forEach(function (b) {
      b.addEventListener('click', function () {
        F.quick = F.quick === b.dataset.quick ? null : b.dataset.quick;
        render();
      });
    });
  }

  function load() {
    fetch('data/notices.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        notices = Array.isArray(data.notices) ? data.notices : [];
        var u = document.getElementById('updated');
        var stamp = data.updated ? new Date(data.updated) : null;
        u.textContent = stamp && !isNaN(stamp)
          ? 'Oppdatert ' + stamp.toLocaleString('nb-NO', { dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Oslo' })
          : 'Ikke oppdatert ennå';
        render();
      })
      .catch(function () {
        document.getElementById('updated').textContent = 'Fant ikke data';
        var list = document.getElementById('list');
        list.replaceChildren(emptyState('Kunne ikke lese data/notices.json',
          'Åpne siden via GitHub Pages eller en lokal webserver (python -m http.server), ikke direkte fra filen.'));
      });
  }

  bind();
  load();
})();
</script>
</body>
</html>
